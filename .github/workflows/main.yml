name: Laravel

on:
  push:
    branches: [ main, develop, feature/**, pre]
jobs:
  Coverage:
    name: カバレッジ
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/laravel
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        options: --health-cmd "mysqladmin ping -h localhost" --health-interval 20s --health-timeout 10s --health-retries 10
        env:
          MYSQL_ROOT_PASSWORD: pass
          MYSQL_DATABASE: test
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: test
      DB_USERNAME: root
      DB_PASSWORD: pass
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug

      - name: copy .env
        run: cp .env.example .env

      - name: composer install
        run: composer install -n --prefer-dist

      - name: generate key
        run: php artisan key:generate

      - name: migrate
        run: php artisan migrate

      - name: coverage
        run: php ./vendor/bin/phpunit --coverage-clover storage/logs/coverage.xml

      - name: upload coverage
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./backend/laravel/storage/logs/coverage.xml

  Testing:
    name: テスト
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/laravel
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        options: --health-cmd "mysqladmin ping -h localhost" --health-interval 20s --health-timeout 10s --health-retries 10
        env:
          MYSQL_ROOT_PASSWORD: pass
          MYSQL_DATABASE: test
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: test
      DB_USERNAME: root
      DB_PASSWORD: pass
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug

      - name: copy .env
        run: cp .env.example .env

      - name: composer install
        run: composer install -n --prefer-dist

      - name: generate key
        run: php artisan key:generate

      - name: migrate
        run: php artisan migrate

      - name: unit test
        run: ./vendor/bin/phpunit

  Analysis:
    name: コード解析
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/laravel
    services:
      mysql:
        image: mysql:8.0
        ports:
          - 3306:3306
        options: --health-cmd "mysqladmin ping -h localhost" --health-interval 20s --health-timeout 10s --health-retries 10
        env:
          MYSQL_ROOT_PASSWORD: pass
          MYSQL_DATABASE: test
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: test
      DB_USERNAME: root
      DB_PASSWORD: pass
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug

      - name: copy .env
        run: cp .env.example .env

      - name: composer install
        run: composer install -n --prefer-dist

      - name: generate key
        run: php artisan key:generate

      - name: deptrac
        run: composer deptrac

  slack-notify:
    if: always()
    needs: [ Testing, Coverage, Analysis ]
    name: workflow notification to slack
    runs-on: ubuntu-latest
    steps:
      - uses: Gamesight/slack-workflow-status@master
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
