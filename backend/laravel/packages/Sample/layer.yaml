deptrac:
  paths:
    - ./packages
  exclude_files:
    - '#.*test.*#i'
  layers:
    - name: Sample_Infrastructure
      collectors:
        - type: className
          regex: .*Sample\\Infrastructure\\.*

    - name: Sample_Presentation
      collectors:
        - type: className
          regex: .*Sample\\Presentation\\.*

    - name: Sample_Application
      collectors:
        - type: className
          regex: .*Sample\\Application\\.*

    - name: Sample_Domain
      collectors:
        - type: className
          regex: .*Sample\\Domain\\.*

    - name: Base
      collectors:
        - type: className
          regex: Base\\.*\\.*

  ruleset:
    Sample_Domain:
      - Base
    Sample_Presentation:
      - Sample_Application
      - Sample_Domain
      - Base
    Sample_Application:
      - Sample_Domain
      - Base
    Sample_Infrastructure:
      - Sample_Domain
      - Base
