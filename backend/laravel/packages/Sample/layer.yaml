deptrac:
  paths:
    - ./packages
  exclude_files:
    - '#.*test.*#i'
  layers:
    - name: Sample_Infrastructure
      collectors:
        - type: glob
          value: '*Sample/Infrastructure*'

    - name: Sample_Presentation
      collectors:
        - type: glob
          value: '*Sample/Presentation*'

    - name: Sample_Application
      collectors:
        - type: glob
          value: '*Sample/Application*'

    - name: Sample_Domain
      collectors:
        - type: glob
          value: '*Sample/Domain*'

    - name: Base
      collectors:
        - type: glob
          value: '*Base*'

  ruleset:
    Sample_Domain:
      - Base
    Sample_Presentation:
      - Sample_Application
      - Sample_Domain
      - Base
    Sample_Application:
      - Sample_Domain
      - Base
    Sample_Infrastructure:
      - Sample_Domain
      - Base
